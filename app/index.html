<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://api.deezer.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; connect-src 'self' https:; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c1c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Solam">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="icon" href="icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Solam</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="mobile.css">
</head>
<body>
  <canvas id="bg"></canvas>

  <header id="titlebar">
    <div class="brand"><img src="icon.png" alt=""><span>Solam</span><span class="beta-tag">BETA</span><button id="update-notice" hidden></button><button id="inbox-button" class="icon-button" title="Notifications" data-t="title" aria-label="Notifications"></button></div>
    <div class="win-buttons">
      <button id="win-min" title="Minimize" data-t="title" aria-label="Minimize"></button>
      <button id="win-max" title="Maximize" data-t="title" aria-label="Maximize"></button>
      <button id="win-close" title="Close" data-t="title" aria-label="Close"></button>
    </div>
  </header>

  <nav id="dock" class="glass pulse" aria-label="Main menu"></nav>

  <main id="stage">
    <section class="page" id="page-home"><div class="glass panel scroll" id="home"></div></section>
    <section class="page" id="page-library"><div class="glass panel scroll" id="library"></div></section>
    <section class="page" id="page-artists"><div class="glass panel scroll" id="artists"></div></section>
    <section class="page" id="page-artist"><div class="glass panel scroll" id="artist"></div></section>
    <section class="page" id="page-collection"><div class="glass panel scroll" id="collection"></div></section>
    <section class="page" id="page-connectors"><div class="glass panel scroll" id="connectors"></div></section>
    <section class="page" id="page-upload"><div class="glass panel scroll" id="upload"></div></section>
    <section class="page" id="page-premium"><div class="glass panel scroll" id="premium"></div></section>
    <section class="page" id="page-account"><div class="glass panel scroll" id="account"></div></section>
    <section class="page" id="page-settings"><div class="glass panel scroll" id="settings"></div></section>
  </main>

  <section id="bigcover" aria-hidden="true">
    <button class="icon-button" id="bigcover-close" title="Close big cover" data-t="title" aria-label="Close big cover"></button>
    <div class="bc-art">
      <canvas id="bc-viz"></canvas>
      <img id="bc-img" alt="">
    </div>
    <div class="bc-side">
      <h1 id="bc-title"></h1>
      <p id="bc-artist"></p>
      <button id="bc-full" class="chip full-song" hidden></button>
      <div class="bc-tools">
        <button id="bc-next" class="chip"></button>
        <button id="bc-comments" class="chip"></button>
        <button id="bc-share" class="chip"></button>
      </div>
      <div class="glass bc-lyrics" id="bc-lyrics"></div>
    </div>
  </section>

  <footer id="player" class="glass pulse">
    <button id="np-art" title="Open big cover" data-t="title" aria-label="Open big cover"><img alt=""></button>
    <div class="np-text">
      <strong id="np-title"></strong>
      <span id="np-artist"></span>
    </div>
    <button id="np-heart" class="icon-button heart" title="Add to favourites" aria-label="Add to favourites" data-t="title" hidden></button>
    <span class="badge" id="np-badge" hidden></span>
    <button id="np-full" class="chip full-song" hidden></button>
    <div class="np-center">
      <div class="np-controls">
        <button id="np-shuffle" class="icon-button" title="Shuffle" data-t="title" aria-label="Shuffle" aria-pressed="false"></button>
        <button id="np-prev" class="icon-button" title="Previous" data-t="title" aria-label="Previous"></button>
        <button id="np-play" class="icon-button big" title="Play or pause" data-t="title" aria-label="Play or pause"></button>
        <button id="np-next" class="icon-button" title="Next" data-t="title" aria-label="Next"></button>
        <button id="np-repeat" class="icon-button" title="Repeat" data-t="title" aria-label="Repeat"></button>
      </div>
      <div class="np-time">
        <span id="np-pos">0:00</span>
        <input id="np-seek" type="range" min="0" max="1000" value="0" aria-label="Position">
        <span id="np-dur">0:00</span>
      </div>
    </div>
    <canvas id="np-viz" width="150" height="46"></canvas>
    <div class="np-tools">
      <input id="np-volume" type="range" min="0" max="1" step="0.01" aria-label="Volume">
      <button id="np-mini" class="icon-button" title="Mini player" data-t="title" aria-label="Mini player"></button>
    </div>
  </footer>

  <div id="update-box" class="glass" role="dialog" aria-labelledby="update-title" hidden>
    <h2 id="update-title"></h2>
    <p id="update-note"></p>
    <div class="actions">
      <button id="update-action" class="button primary"></button>
      <button id="update-later" class="button"></button>
    </div>
  </div>

  <div id="toast" role="status"></div>
  <audio id="audio" preload="metadata"></audio>
  <audio id="audio2" preload="metadata"></audio>

  <script src="translations.js"></script>
  <script src="web-config.js"></script>
  <script src="i18n.js"></script>
  <script src="qrcode.js"></script>
  <script src="connectors.js"></script>
  <script src="music-core.js"></script>
  <script src="social-core.js"></script>
  <script src="web-backend.js"></script>
  <script src="web-bridge.js"></script>
  <script src="themes.js"></script>
  <script src="glass.js"></script>
  <script src="app.js"></script>
  <script src="register-sw.js"></script>
</body>
</html>
